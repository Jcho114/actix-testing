[package]
name = "actix-testing"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
diesel = { version = "2.2.9", features = ["sqlite", "r2d2", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
diesel_derives = "2.2.0"
serde = { version = "1.0.219", features = ["derive"] }
env_logger = "0.11.8"
dotenvy = "0.15.7"
envy = "0.4.2"
once_cell = "1.21.3"
secrecy = { version = "0.10.3", features = ["serde"] }
pwhash = "1.0.0"
regex = "1.11.1"
jsonwebtoken = "9.3.1"
